name: Hosted CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npx playwright install --with-deps msedge
      - name: Run hosted Playwright tests
        run: npx playwright test --config playwright.hosted.config.js --reporter=github
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-playwright-diagnostics-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

# Render blueprint for the hosted lane. See docs/adr/0001-hosted-platform.md.
#
# Render is used because this app needs a long-lived WebSocket connection for the
# realtime queue. Static/serverless hosts (Netlify, Vercel) cannot hold a socket
# open, so the display would never see a phone's changes without a manual refresh.
services:
  - type: web
    name: karaoke-station
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm test -- --maxWorkers=1 && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      # sync:false means Render prompts for this in the dashboard and stores it as a
      # secret. The key must never be written into this file or committed anywhere.
      - key: YOUTUBE_API_KEY
        sync: false
      # Left unset on purpose: the server falls back to RENDER_EXTERNAL_URL, which
      # Render injects with the service's own public URL. Set this explicitly only
      # when serving from a custom domain.
